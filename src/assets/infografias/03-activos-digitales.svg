<text x="1000" y="118" text-anchor="end" class="ig03-h" font-size="30" font-weight="700"><tspan fill="#0CF25D">g</tspan><tspan fill="#F4F6F5">-digital</tspan></text>
<text x="90" y="206" class="ig03-h" font-size="50" font-weight="600" fill="#F4F6F5">Tokenizar activos reales</text>
<text x="90" y="266" class="ig03-h" font-size="50" font-weight="600" fill="#F4F6F5">con <tspan fill="#2BD4B0">licencia para operar</tspan>.</text>
<text x="90" y="324" class="ig03-b" font-size="23" fill="#9AA39F">Mercados digitales bajo marco regulado de la Unión Europea.</text>

