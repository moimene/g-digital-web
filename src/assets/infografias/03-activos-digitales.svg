<text x="90" y="804" class="ig03-h" font-size="30" font-weight="700" fill="#2BD4B0">01</text>
<text x="162" y="800" class="ig03-h" font-size="24" font-weight="600" fill="#F4F6F5">OpenBrick</text>
<text x="162" y="832" class="ig03-b" font-size="18" fill="#9AA39F">Tokenización inmobiliaria bajo el Régimen Piloto DLT (CNMV).</text>
<text x="90" y="964" class="ig03-h" font-size="30" font-weight="700" fill="#2BD4B0">02</text>
<text x="162" y="960" class="ig03-h" font-size="24" font-weight="600" fill="#F4F6F5">ioBuilders + Garrigues</text>
<text x="162" y="992" class="ig03-b" font-size="18" fill="#9AA39F">Infraestructura DLT + regulación financiera del despacho.</text>
<text x="90" y="1124" class="ig03-h" font-size="30" font-weight="700" fill="#2BD4B0">03</text>
<text x="162" y="1120" class="ig03-h" font-size="24" font-weight="600" fill="#F4F6F5">RWA, capital y ESG</text>
<text x="162" y="1152" class="ig03-b" font-size="18" fill="#9AA39F">Del inmobiliario a bonos digitales y créditos de carbono.</text>

