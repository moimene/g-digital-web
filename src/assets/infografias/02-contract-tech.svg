<text x="90" y="804" class="ig02-h" font-size="30" font-weight="700" fill="#CCF943">01</text>
<text x="162" y="800" class="ig02-h" font-size="24" font-weight="600" fill="#F4F6F5">Del documento al proceso</text>
<text x="162" y="832" class="ig02-b" font-size="18" fill="#9AA39F">Máquina de estados: preparación, firma, ejecución, cierre.</text>
<text x="90" y="964" class="ig02-h" font-size="30" font-weight="700" fill="#CCF943">02</text>
<text x="162" y="960" class="ig02-h" font-size="24" font-weight="600" fill="#F4F6F5">Motores de reglas, no hardcode</text>
<text x="162" y="992" class="ig02-b" font-size="18" fill="#9AA39F">Lógica explícita, auditable y sin sorpresas en ejecución.</text>
<text x="90" y="1124" class="ig02-h" font-size="30" font-weight="700" fill="#CCF943">03</text>
<text x="162" y="1120" class="ig02-h" font-size="24" font-weight="600" fill="#F4F6F5">Posición contractual visible</text>
<text x="162" y="1152" class="ig02-b" font-size="18" fill="#9AA39F">Contract Guardian vigila tu cartera como un activo.</text>

